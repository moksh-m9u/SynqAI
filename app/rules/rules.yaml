id: R_ORIGIN_50KM
severity: hard_constraint
condition: "km_from_origin_hub <= 50"
action: "replacement vehicle must come from the ticket's ORIGIN hub"
citation: dispatcher_interview
client: any
season: any
route: any
note: "Rajender: within 50 km the origin hub sends. Always. People think nearest hub, software says nearest hub, wrong."
