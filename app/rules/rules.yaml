id: R_HILL_ENGINE_HEATER
severity: hard_constraint
condition: "month in {Nov,Dec,Jan,Feb} AND destination is a hill route (Rudrapur/Nainital)"
action: "candidate must have engine_heater=Yes"
citation: dispatcher_interview
client: any
season: winter
route: hill
---
id: R_HILL_BRAKE_30D
severity: hard_constraint
condition: "month in {Nov,Dec,Jan,Feb} AND destination is a hill route"
action: "candidate must have NO brake work (pad/drum) in the last 30 days"
citation: dispatcher_interview
client: any
season: winter
route: hill
note: "Any brake work. Pad, drum, anything. 30 days of flat running first, then hills."
---
id: R_OVERDUE_SERVICE_GROUNDED
severity: hard_constraint
condition: "vehicle is more than 30 days past its due service date"
action: "vehicle is GROUNDED. It does not move, regardless of emergency."
citation: dispatcher_interview
client: any
season: any
route: any
note: "Evidence-based: maintenance_log contains no scheduled service-due dates; if no due date is recorded the rule is not triggered, with a citation to that finding."
---
id: R_JUGAAD_7D
severity: hard_constraint
condition: "vehicle carries a jogadi/permanent-fix-pending repair entry within the last 7 days (or no permanent fix recorded)"
action: "vehicle must not leave its HOME region until permanent repair is done (7-day clock)"
citation: dispatcher_interview maintenance_log
client: any
season: any
route: any
note: "Guddu ka jugaad holds like a promise, not a part. Seven days. Write it in red."
