id: R_NCR_BS6_WINTER
severity: hard_constraint
condition: "month in {Oct,Nov,Dec,Jan,Feb} AND route touches Delhi NCR (Delhi/Gurgaon/Faridabad/Noida)"
action: "only BS6 vehicles are route-permitted"
citation: dispatcher_interview
client: any
season: winter
route: ncr
note: "GRAP winter restrictions; a BS4 truck can be stopped/challaned/turned back at the border. BS6 only on NCR routes in winter."
