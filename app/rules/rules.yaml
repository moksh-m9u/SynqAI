id: R_CAPACITY_MATCH
severity: soft_constraint
condition: "load tonnage is known AND candidate capacity_tonnes >= load"
action: "candidate must be able to carry the load; prefer closest-capacity fit"
citation: fleet_master
client: any
season: any
route: any
note: "When the ticket carries no tonnage, capacity is used only as a preference, with an 'insufficient information' citation."